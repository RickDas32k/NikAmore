name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        {
          echo "LASTFM_API_KEY=$LASTFM_API_KEY"
          echo "LASTFM_SECRET=$LASTFM_SECRET"
          echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER"
        } > local.properties

        if [ -n "$KEYSTORE_BASE64" ]; then
          # Decode base64 keystore safely (stripping any windows carriage returns and whitespace)
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > nikamp.jks 2>/dev/null || echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > nikamp.jks 2>/dev/null
          if [ -s nikamp.jks ]; then
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            {
              echo "storeFile=nikamp.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > keystore.properties
            echo "Release keystore (nikamp.jks) decoded and configured."
          else
            echo "::error::Failed to decode KEYSTORE_BASE64 or decoded file is 0 bytes. Check that KEYSTORE_BASE64 is a valid base64-encoded keystore."
            rm -f nikamp.jks
            exit 1
          fi
        else
          echo "::warning::KEYSTORE_BASE64 secret is not set. A release build will proceed without keystore signing (producing unsigned APKs)."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nikamp-prod-release
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nikamp-wear-prod-release
        path: wearos/build/outputs/apk/prod/release/*.apk
